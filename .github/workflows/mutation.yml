# Mutation testing (AGENTS.md, section 10): Stryker makes small bugs in a package's code, one at a
# time, and its tests must catch each. Every night main has moved, for every package in
# tools/src/mutation-targets.ts, and handed to an Amp orb that gives each survivor a verdict
# (.github/prompts/mutation-testing.md). By hand, for some packages, on any branch:
# `gh workflow run mutation.yml --ref <branch> -f folders=<folder>,<folder>`; orbs measure their work
# this way, never in the orb. Each package is split into shards of about 1,200 lines, each with a
# file its tests load (mutation-shards.ts), one job each, sized to finish well inside the 6 hours
# GitHub gives a job: the first run's longest shard took 83 minutes, and the whole run 2 hours; the
# last job scores each package from its shards and fails when one is under its floor. The run's
# summary has the scores, its `mutation-results` artifact the scores and every survivor, and each
# shard's artifact Stryker's reports, the HTML one showing what survived.
name: Mutation testing

on:
  schedule:
    # Start the previous evening: GitHub cron is UTC, so 17:17 is 18:17 in Warsaw (CET)
    # or 19:17 (CEST). Allow ~2 hours to mutate and ~80 minutes for Amp's follow-up.
    # Recent scheduled runs started 5–6 hours late; even with a 6-hour delay this budget
    # finishes around 03:37 CET / 04:37 CEST. Aim to be ready by 04:00–05:00 Warsaw,
    # not to start Amp then. GitHub scheduling/queues and longer work can still overrun.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      folders:
        description: "Only these packages' folders, comma-separated, such as product/engines/phones; all when empty"
        type: string
        default: ""
      amp:
        description: "Hand the results to an Amp orb, as the nightly run does"
        type: boolean
        default: false

permissions:
  contents: read
  # To see whether a run already measured this commit.
  actions: read

# One run at a time; one started meanwhile waits.
concurrency:
  group: mutation
  cancel-in-progress: false

env:
  FOLDERS: ${{ inputs.folders }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      measure: ${{ steps.plan.outputs.measure }}
    steps:
      - name: Get the commit
        run: |
          set -euo pipefail
          git init --quiet .
          git fetch --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - uses: ./.github/actions/install-nix

      # The shards' install scripts make what type checks and the dashboard's tests need, not these.
      # A night main hasn't moved measures nothing: the same commit has the same scores. Only nightly
      # runs count, as a run by hand may have measured some packages only.
      - name: Plan the shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          measured=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation.yml --commit "$GITHUB_SHA" \
            --event schedule --status completed --json conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")] | length')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$measured" != 0 ]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_SHA::7} was measured already; main hasn't moved since." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./dev bun install --frozen-lockfile --ignore-scripts
          echo "measure=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$(./dev bun tools/src/main.ts mutation plan ${FOLDERS:+--only "$FOLDERS"})" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: ${{ needs.plan.outputs.measure == 'true' }}
    name: ${{ matrix.folder }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-24.04
    # Stops a shard well before GitHub's 6 hours would, so it fails as ours, with time to spare.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # The organization runs 20 jobs at once; this leaves room for the checks of pushes meanwhile.
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FOLDER: ${{ matrix.folder }}
      MUTATE: ${{ matrix.mutate }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Get the commit
        run: |
          set -euo pipefail
          git init --quiet .
          git fetch --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - uses: ./.github/actions/install-nix

      - name: Mutate
        run: |
          set -euo pipefail
          ./dev bun install --frozen-lockfile --ignore-scripts
          ./dev sh -c 'cd "$FOLDER" && "$1/node_modules/.bin/stryker" run "$1/stryker.config.json" --mutate "$MUTATE"' \
            sh "$PWD"

      - name: Keep the reports
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mutation/$FOLDER"
          cp "$FOLDER/.stryker/mutation.json" "$RUNNER_TEMP/mutation/$FOLDER/shard-$SHARD.json"
          cp "$FOLDER/.stryker/mutation.html" "$RUNNER_TEMP/mutation/$FOLDER/shard-$SHARD.html"

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutation
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [plan, shard]
    # Scores even when a shard failed, to say which; a package missing one has no score.
    if: ${{ !cancelled() && needs.plan.outputs.measure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the commit
        run: |
          set -euo pipefail
          git init --quiet .
          git fetch --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - uses: ./.github/actions/install-nix

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/mutation

      - name: Score
        run: |
          set -euo pipefail
          ./dev bun install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/results"
          ./dev bun tools/src/main.ts mutation report "$RUNNER_TEMP/mutation" ${FOLDERS:+--only "$FOLDERS"} \
            | tee "$RUNNER_TEMP/results/scores.md" >> "$GITHUB_STEP_SUMMARY"

      - name: List the survivors
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./dev bun tools/src/main.ts mutation survivors "$RUNNER_TEMP/mutation" ${FOLDERS:+--only "$FOLDERS"} \
            > "$RUNNER_TEMP/results/survivors.md"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 30

      # The orb works on the project's main, signed in as the owner of AMP_API_KEY, an access token
      # from Amp's settings (sgamp_…). Only the nightly run, or one asked to, starts one, so an orb
      # that measures its own work doesn't start another.
      - name: Hand the results to Amp
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.amp) }}
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$AMP_API_KEY" ]; then
            echo "::error::Set the repository's AMP_API_KEY secret to an Amp access token: gh secret set AMP_API_KEY"
            exit 1
          fi
          npm install --global --silent @sourcegraph/amp@0.0.1792857622-ge1551c
          { cat .github/prompts/mutation-testing.md; printf '\n## This run\n\n- Run: %s\n- Commit: %s\n' "$RUN_URL" "$GITHUB_SHA"; } \
            | amp -ox --project "$GITHUB_REPOSITORY" --title "Mutation testing at ${GITHUB_SHA::7}" \
              --attach "$RUNNER_TEMP/results/scores.md" --attach "$RUNNER_TEMP/results/survivors.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"
